name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: ubuntu-24.04-arm
            target: linux-arm64
          - runner: macos-15-intel
            target: darwin-x64
          - runner: macos-15
            target: darwin-arm64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.0"
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.19
          cache: npm
      - run: npm ci --omit=dev
      - run: cargo build --release --locked
      - name: Package
        shell: bash
        run: |
          mkdir package
          cp target/release/seraph package/
          cp -R auth node_modules package/
          printf '%s\n' "${GITHUB_REF_NAME}" > package/VERSION
          tar -czf "seraph-${{ matrix.target }}.tar.gz" -C package .
          if command -v sha256sum >/dev/null; then
            sha256sum "seraph-${{ matrix.target }}.tar.gz" > "seraph-${{ matrix.target }}.tar.gz.sha256"
          else
            shasum -a 256 "seraph-${{ matrix.target }}.tar.gz" > "seraph-${{ matrix.target }}.tar.gz.sha256"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: seraph-${{ matrix.target }}
          path: seraph-${{ matrix.target }}.tar.gz*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: dist
          merge-multiple: true
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --verify-tag
        env:
          GH_TOKEN: ${{ github.token }}
