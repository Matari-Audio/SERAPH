[package]
name = "seraph"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
bytes = "1.10"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7", features = ["codec"] }
