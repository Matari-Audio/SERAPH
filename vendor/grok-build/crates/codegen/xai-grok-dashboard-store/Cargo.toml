[package]
license = "Apache-2.0"
name = "xai-grok-dashboard-store"
version = "0.1.0"
edition.workspace = true
description = "SQLite-backed persistent dashboard workspace: membership, layout ranks, grouping"

[dependencies]
# rusqlite with the bundled, self-contained SQLite.
# Keep in step with xai-sqlite-journal (CVE-2025-29087/-3277/-6965 floor).
rusqlite = { version = "0.41", features = ["bundled"] }
thiserror = { workspace = true }
tracing = { workspace = true }
xai-grok-config = { workspace = true }
xai-sqlite-journal = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

[lints]
workspace = true
